[package]
name = "igrf-app"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "igrf-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
  "glow",
  "default_fonts",
] }
# Human-readable local timestamps in the CSV, matching the C# logger.
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
egui_plot = "0.37.0"
igrf-core = { path = "../igrf-core" }
igrf-io = { path = "../igrf-io" }
# rfd is declared per-target below: the Buildroot kiosk image has neither
# zenity nor xdg-desktop-portal, so Linux uses rfd's GTK3 backend while
# Windows (and macOS) keep the default native dialogs.
serialport = "4.9"
dotenvy = "0.15"

# Windowing backends are platform specific: asking for x11 on Windows fails to
# build, and leaving both off on Linux leaves eframe with no backend at all.
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
  "glow",
  "default_fonts",
  "x11",
  "wayland",
] }
# Direct handle on winit (Cargo unifies it to the version eframe pins) so `main`
# can force the X11 / XWayland backend - see the comment there. The `x11`
# feature gates the extension trait used for that; defaults are off so this
# does not pull winit's Wayland client-side-decoration renderer.
winit = { version = "0.30", default-features = false, features = ["x11"] }

# Enabling the gtk3 feature makes rfd compile its xdg-portal backend out
# entirely (its `not(feature = "gtk3")` cfg), so the dialog works on the kiosk
# image without any portal service. default-features = false keeps the
# portal/wayland crates out of the image. gtk-sys needs GTK3 >= 3.24 via
# pkg-config at build time.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17" }
