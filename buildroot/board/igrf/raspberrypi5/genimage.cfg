# Pi 5 loads its boot firmware from EEPROM; these are the SD boot files.
image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image",
			"bcm2712-rpi-5-b.dtb",
			"bcm2712d0-rpi-5-b.dtb",
			"bcm2712-rpi-500.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays"
		}
	}
	size = 128M
}

image data.ext4 {
	ext4 {
		use-mke2fs = true
		label = "data"
	}
	empty = true
	# Build-time floor, NOT a logging quota. igrf-grow-data.service grows
	# partition 3 to card capacity, then resize2fs, before mounting /data.
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x49475246
		align = 1M
	}
	partition boot {
		partition-type = 0xC
		bootable = true
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
