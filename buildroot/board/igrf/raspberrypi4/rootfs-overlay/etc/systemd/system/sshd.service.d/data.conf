[Unit]
Requires=igrf-data-init.service
After=igrf-data-init.service

[Service]
# sshd refuses to start without its privilege-separation directory. The
# Buildroot unit does not create one, so the unit does it here.
RuntimeDirectory=sshd
RuntimeDirectoryMode=0755
ExecStartPre=
ExecStartPre=/usr/lib/igrf/ssh-keys.sh
ExecStart=
ExecStart=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config_igrf
