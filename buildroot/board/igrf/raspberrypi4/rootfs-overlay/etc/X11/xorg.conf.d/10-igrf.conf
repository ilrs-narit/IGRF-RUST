# IGRF kiosk X11 configuration (Raspberry Pi 5, HDMI panel + USB touch).
#
# The KMS driver stack is vc4/v3d (dtoverlay=vc4-kms-v3d in config_4_64bit.txt),
# so Xorg uses the generic "modesetting" driver on top of KMS/DRM — there is
# no Pi-specific Xorg driver and none is needed.
#
# =====================================================================
# PROVISIONAL DISPLAY MODE — NOT VERIFIED ON HARDWARE
# =====================================================================
# The exact 1024x600 panel model is still unknown (docs/buildroot-design.md,
# "ระบบแสดงผลรุ่นแรก": HDMI video + USB touch, model TBD). The Modeline
# below is the stock CVT timing for 1024x600@60 and exists only so the
# server has a definite mode to prefer. Most HDMI panels of this class
# advertise 1024x600 over EDID, in which case EDID wins and this Modeline
# is ignored. Once the panel is known, replace this block with the panel's
# datasheet timing (or delete it and trust EDID) and re-test on hardware.

Section "Device"
    Identifier  "IGRF-V3D"
    Driver      "modesetting"
EndSection

Section "Monitor"
    Identifier  "IGRF-Panel"
    # PROVISIONAL: CVT 1024x600@59.85, 48.96 MHz pixel clock.
    Modeline    "1024x600" 48.96 1024 1064 1168 1312 600 601 604 622 -hsync +vsync
    Option      "PreferredMode" "1024x600"
EndSection

Section "Screen"
    Identifier  "IGRF-Screen"
    Device      "IGRF-V3D"
    Monitor     "IGRF-Panel"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1024x600"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "IGRF-Layout"
    Screen      "IGRF-Screen"
EndSection
