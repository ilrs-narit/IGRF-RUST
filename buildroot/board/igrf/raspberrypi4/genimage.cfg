# The Pi 4 boot ROM loads start4.elf/fixup4.dat from this FAT partition
# (bootcode.bin is rpi 0/1/2/3-only — package/rpi-firmware/Config.in).
image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image",
			"bcm2711-rpi-4-b.dtb",
			"bcm2711-rpi-400.dtb",
			"bcm2711-rpi-cm4.dtb",
			"bcm2711-rpi-cm4s.dtb",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays"
		}
	}
	size = 128M
}

image data.ext4 {
	ext4 {
		use-mke2fs = true
		label = "data"
	}
	empty = true
	# Build-time floor, NOT a logging quota. igrf-grow-data.service grows
	# partition 3 to card capacity, then resize2fs, before mounting /data.
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x49475246
		align = 1M
	}
	partition boot {
		partition-type = 0xC
		bootable = true
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
