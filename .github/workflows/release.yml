name: CI and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Pi 5 runs 64-bit Raspberry Pi OS (Bookworm, glibc 2.36). The
          # GitHub-hosted arm64 runner builds natively - no cross toolchain,
          # no QEMU - so this only needs the same apt packages as the
          # x86_64 leg, just resolved for arm64.
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-22.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fdisk \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          python3 tools/test-buildroot-board.py
          python3 tools/test-buildroot-data.py

      - name: Build release binary
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --package igrf-app

      - name: Prepare release archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: package
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "igrf-app") | .version')"
          package="igrf-app-${version}-linux-${{ matrix.arch }}.tar.gz"

          mkdir -p dist/package
          cp target/release/igrf-app SystemConfig.example.json dist/package/
          tar -C dist/package -czf "dist/${package}" igrf-app SystemConfig.example.json
          sha256sum "dist/${package}" > "dist/${package}.sha256"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: |
            dist/${{ steps.package.outputs.package }}
            dist/${{ steps.package.outputs.package }}.sha256
          retention-days: 1

  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      BUILDROOT_COMMIT: d5180309b1b66ef3b8eaccca70ad69be8e0729a1
      BR2_DL_DIR: ${{ github.workspace }}/buildroot/dl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Buildroot host
        run: |
          # These unused SDKs belong to this disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio rsync file \
            unzip wget git python3 libncurses-dev libssl-dev xz-utils fdisk e2fsprogs
          df -h .

      - name: Check board and data hooks
        run: |
          python3 tools/test-buildroot-board.py
          python3 tools/test-buildroot-data.py

      - name: Checkout pinned Buildroot
        run: |
          git init buildroot-src
          git -C buildroot-src remote add origin https://gitlab.com/buildroot.org/buildroot.git
          git -C buildroot-src fetch --depth=1 origin "$BUILDROOT_COMMIT"
          git -C buildroot-src checkout --detach FETCH_HEAD
          test "$(git -C buildroot-src rev-parse HEAD)" = "$BUILDROOT_COMMIT"

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          # Hash dependency inputs only; avoid overlay symlinks and generated dl/output trees.
          key: buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_COMMIT }}-${{ hashFiles('buildroot/configs/**', 'buildroot/package/**', 'Cargo.lock') }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_COMMIT }}-

      - name: Build Pi 4 SD image
        run: |
          make -C buildroot-src O="$GITHUB_WORKSPACE/buildroot/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" igrf_raspberrypi4_defconfig
          make -C buildroot-src O="$GITHUB_WORKSPACE/buildroot/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" BR2_JLEVEL="$(nproc)"

      - name: Package SD image
        run: |
          test -s buildroot/output/images/sdcard.img
          mkdir -p dist
          gzip -c buildroot/output/images/sdcard.img > dist/igrf-pi4-sdcard.img.gz
          gzip -t dist/igrf-pi4-sdcard.img.gz
          cd dist
          sha256sum igrf-pi4-sdcard.img.gz > igrf-pi4-sdcard.img.gz.sha256
          sha256sum -c igrf-pi4-sdcard.img.gz.sha256

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: package-pi4-image
          path: dist/igrf-pi4-sdcard.img.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          download="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}"
          printf '%s\n' \
            '## Raspberry Pi 4 SD image' \
            'Complete bootable kiosk image with the IGRF app; download it below to flash your SD card.' \
            '' \
            "- [Download Pi 4 image (.img.gz)](${download}/igrf-pi4-sdcard.img.gz)" \
            "- [Download SHA-256 checksum](${download}/igrf-pi4-sdcard.img.gz.sha256)" \
            '' \
            'Save both files in the same directory, then verify and decompress:' \
            '```sh' \
            'sha256sum -c igrf-pi4-sdcard.img.gz.sha256' \
            'gzip -dk igrf-pi4-sdcard.img.gz' \
            '```' \
            'Back up your SD card, then select the extracted .img in your flashing tool. Flashing replaces all data on the card.' \
            '' \
            'Standalone Linux application archives are also available under Assets.' \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "${tag}" \
            --target "$GITHUB_SHA" \
            --title "IGRF ${tag}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            dist/*
